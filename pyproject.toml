# Purpose: Active-labeling package and CLI metadata.
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="jev-label"
version="0.1.0"
description="Probability-driven active labeling with a structurally isolated holdout."
requires-python=">=3.11"
license={text="MIT"}
dependencies=[]
[project.scripts]
jev-label="jev_label.cli:main"
[tool.setuptools.packages.find]
where=["src"]
